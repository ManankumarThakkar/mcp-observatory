name: Pages

on:
  push:
    branches: [main]
    # Only what the site is built from. A documentation edit should not redeploy
    # the dashboard, and a redeploy that changes nothing still rewrites the
    # published timestamp, which makes the deployment history unreadable.
    paths:
      - "data/**"
      - "analyzer/report/**"
      - "analyzer/rules/**"
      - ".github/workflows/pages.yml"
  # So a deploy can be triggered without an empty commit.
  workflow_dispatch:

# Named per job rather than at the top level. The build needs nothing but the
# checkout; only the deploy needs to write Pages, and stating it once at the top
# would hand the build permissions it has no use for.
permissions:
  contents: read

# One deployment at a time, and a newer push wins. Two concurrent deploys race
# on the same Pages target and whichever finishes last publishes, which can be
# the older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pinned to immutable commit SHAs, not tags, for the reason the CI
      # workflow gives: a tag is mutable, so whoever controls it controls code
      # running here. Harder to defend than usual in a project whose subject is
      # supply-chain trust.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      # Built here rather than committed. The pages are derived from data/, and
      # a checked-in copy goes stale against the findings it describes - which
      # would publish figures that disagree with the data in the same commit.
      - name: Build the site
        run: mcp-observatory site

      # A deploy that published an empty or broken page would look exactly like
      # a successful one until somebody opened it. These are the claims the page
      # cannot be allowed to get wrong.
      - name: Check what is about to be published
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path

          page = Path("web/index.html").read_text(encoding="utf-8")
          summary = json.loads(Path("data/summary.json").read_text(encoding="utf-8"))

          problems = []
          if len(page) < 4000:
              problems.append(f"index.html is only {len(page)} bytes")
          for figure in (summary["corpus"], summary["scanned"]):
              if f"{figure:,}" not in page:
                  problems.append(f"{figure:,} is missing from the page")
          if "not yet measured" not in page.lower():
              problems.append("the page does not say accuracy is unmeasured")
          if "withheld" not in page.lower():
              problems.append("the page does not mention withheld findings")
          if not Path("web/findings.html").exists():
              problems.append("findings.html was not built")
          if not list(Path("web/servers").glob("*.html")):
              problems.append("no server pages were built")

          if problems:
              sys.exit("refusing to deploy:\n  " + "\n  ".join(problems))
          print(f"{len(page):,} bytes, {len(list(Path('web/servers').glob('*.html')))} server pages")
          PY

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
