name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only is already the repository default. Stating it here means a change
# to that default cannot silently widen what this workflow may do.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Report both versions rather than stopping at the first failure. Knowing
      # a break is 3.11-only is most of the diagnosis.
      fail-fast: false
      matrix:
        # 3.11 is the requires-python floor. Everything so far has only ever
        # run on 3.12, so without this the floor is a promise we have never
        # tested. mypy is pinned to 3.11 semantics, but it does not execute.
        python-version: ["3.11", "3.12"]

    steps:
      # Actions are pinned to immutable commit SHAs, not tags. A tag is
      # mutable, so whoever controls it controls code running in our CI with a
      # token and this repository. Acceptable for most projects; hard to
      # defend in one whose subject is supply-chain trust in a plugin
      # ecosystem.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Types
        run: mypy

      # Bare pytest, never `python -m pytest`. The -m form prepends the working
      # directory to sys.path, so the suite passes even when the editable
      # install is broken. This is the one place that genuinely proves
      # packaging, which is what Task 1 existed to establish.
      - name: Test
        run: pytest -v
