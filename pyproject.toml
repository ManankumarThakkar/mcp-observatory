[project]
name = "mcp-observatory"
version = "0.1.0"
requires-python = ">=3.11"
# The first runtime dependencies, and the discussion CLAUDE.md requires was
# settled in DECISIONS.md D3. Three packages, and a fourth needs its own
# conversation: JavaScript needs no grammar of its own, because the tsx
# grammar reads the whole JavaScript family including JSX in a .js file.
#
# tree-sitter is floored at 0.25, which is where query execution moved out of
# Query and into QueryCursor. Most examples in circulation still call
# query.captures(node) and raise AttributeError; the floor stops the old shape
# being resolved by accident.
dependencies = [
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
mcp-observatory = "analyzer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# evals ships too. CI runs bare pytest, which does not put the working
# directory on sys.path, so the harness has to be installed to be
# importable at all. It also has to be installed for the reason
# DECISIONS.md D8 gives: the scoring script is published for other people
# to run against the benchmark, and a script nobody can install is not.
packages = ["analyzer", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Fixtures are sample MCP servers standing in for third-party code, not source
# we maintain, so our lint standards do not apply to them in either direction.
#
# The vulnerable ones are deliberately dangerous: ruff has 413 rules enabled
# here, several of which exist to catch exactly what those files demonstrate
# (PLE2502 bidirectional-unicode, PLE2515 zero-width-space). Linting them means
# suppressing the tool for finding what we planted.
#
# The clean ones matter more, and are the reason this is a blanket exclude
# rather than a per-file ignore. Their job is to be realistic near-misses that
# must NOT trigger a rule. A real MCP server in the wild does not pass 413 lint
# rules: the clean shell-exec fixture calls `subprocess.run` without `check=`,
# which is ordinary real-world code and trips PLW1510. Forcing the clean
# fixtures to satisfy our standards would make them unrepresentative of the
# code they stand in for, which defeats their purpose.
extend-exclude = ["fixtures"]

[tool.mypy]
# 3.11 is the requires-python floor, not the version we happen to run. Checking
# against the floor catches syntax and stdlib calls that only exist in 3.12.
python_version = "3.11"
strict = true
files = ["analyzer", "evals", "tests"]
